name: skillmatch
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  http: ^1.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/IT_Job_Roles_Skills.csv
    - assets/data/career_pathway_links.json
    - assets/data/psf_assessments.json
    - assets/images/app_icon.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpeg"